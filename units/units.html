<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Stats</title>
    <link rel="stylesheet" href="units.css">
</head>
<body>
    <div class="container">
        <h2>General Stats</h2>

        <div class="stat">
            <p>New Visitors</p>
            <div class="progress-bar">
                <div class="progress green">25%</div>
            </div>
        </div>

        <div class="stat">
            <p>New Users</p>
            <div class="progress-bar">
                <div class="progress orange">50%</div>
            </div>
        </div>

        <div class="stat">
            <p>Bounce Rate</p>
            <div class="progress-bar">
                <div class="progress red">75%</div>
            </div>
        </div>
    </div>
</body>
</html>
